# CI — runs on every push and pull request. Nothing here touches the demo server
# or Grafana, and no secrets are used, so it is safe for a public repository.
name: CI

on:
  push:
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test (PostGIS, arm64)
    # arm64, like the Mac: "arm64 everywhere"
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v6

      - name: Build the project's own PostGIS image (the tests run against it, not postgres:latest)
        run: docker build --tag ladebahn/postgres:16-postgis docker/postgres

      - name: Run the tests (Testcontainers starts a real PostGIS)
        run: ./gradlew test --no-daemon

      - name: Package the app
        run: ./gradlew bootJar --no-daemon -x test

      - name: Keep the test report if anything failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-report
          path: build/reports/tests/test
          retention-days: 7

  terraform:
    name: Terraform fmt + validate
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.16.3
          terraform_wrapper: false

      - name: Formatting (fails on any file not in the standard layout)
        run: terraform fmt -check -recursive -diff infra

      - name: Validate each configuration (no state, no credentials)
        run: |
          for dir in infra/playground infra/local-db infra/grafana; do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done
